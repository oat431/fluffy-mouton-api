name: CI

on:
  push:
    branches: [deploy, dev, "feat/**"]
  pull_request:
    branches: [deploy]

jobs:
  lint-test-build:
    name: Lint → Test → Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fluffy
          POSTGRES_PASSWORD: fluffy
          POSTGRES_DB: fluffy_mouton_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: fluffy
      DB_PASSWORD: fluffy
      DB_NAME: fluffy_mouton_test
      SECRET: ci-test-secret-do-not-use-in-prod
      PORT: "8080"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Lint
        run: go vet ./...

      - name: Test
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Build
        run: go build -o /dev/null ./cmd/api
