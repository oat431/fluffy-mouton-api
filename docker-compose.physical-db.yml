services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fluffy-mouton-api:latest
    container_name: fluffy-mouton-api
    env_file:
      - .env
    environment:
      PORT: ${PORT:-8080}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - ./.env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${PORT:-8080}/api/v1/health/check || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
